name: release

# Two triggers, two jobs, and they never overlap:
#   push a v* tag         -> release only (this is the only thing that publishes)
#   pull request / manual -> test only (nothing is published)
on:
  push:
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

# Read-only by default. Jobs that must write raise it themselves, so a step
# added to the test job cannot acquire write access by accident.
permissions:
  contents: read

jobs:
  test:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      # The Dockerfile pins its own toolchain (`golang:X.Y-alpine`), so "one Go
      # version" is only true while those two pins agree. A tag build that
      # disagrees would ship binaries and an image on different compilers.
      - name: Check Go version pins agree
        run: |
          set -euo pipefail
          mod_version=$(awk '$1 == "go" { print $2 }' go.mod)
          image_version=$(grep -oE 'golang:[0-9]+\.[0-9]+' Dockerfile | head -1 | cut -d: -f2)
          mod_minor=$(echo "$mod_version" | cut -d. -f1,2)
          image_minor=$(echo "$image_version" | cut -d. -f1,2)
          echo "go.mod: $mod_version   Dockerfile: $image_version"
          if [ -z "$image_version" ] || [ "$mod_minor" != "$image_minor" ]; then
            echo "::error::go.mod ($mod_minor) and the Dockerfile toolchain ($image_minor) disagree"
            exit 1
          fi

      - name: Verify
        run: |
          set -euo pipefail
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed:"; echo "$unformatted"; exit 1
          fi
          go vet ./...
          go test ./...
          # -race is the cheapest check this design allows: the runtime is swapped
          # through an atomic.Pointer, and the semaphores and the mutex-guarded
          # maps are where a data race would only show up under load.
          go test -race ./...

      # The release job depends on this script, and a shell script that only ever
      # runs at tag time fails at the worst possible moment. Running it here, on
      # a pull request, keeps that surprise off the release path.
      - name: Extract a changelog entry
        run: |
          set -euo pipefail
          sh scripts/changelog-notes.sh v0.1.0 | head -5

      # The unit tests cannot see the assembly. This project broke twice in
      # ways no test caught: a container with no published port, and an example
      # config whose listen address could never be reached through the
      # published one. Both looked healthy from inside. So the default path is
      # built and exercised for real here. docker and curl are on the runner.
      - name: Smoke test the default deployment path
        run: sh scripts/compose-smoke.sh

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
      packages: write # push the image to GHCR
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      # Cheap insurance: a tag that does not pass its own tests must not be
      # published, because deleting a release people already pulled is worse
      # than a red workflow.
      - name: Verify
        run: |
          set -euo pipefail
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed:"; echo "$unformatted"; exit 1
          fi
          go vet ./...
          go test ./...
          # Same race detector run as the test job: a tag push is the one trigger
          # where that job is gated off, and this is the job that publishes.
          go test -race ./...

      # Same check as the test job: a tag can be pushed without a pull request,
      # and the binaries and the image must come from the same Go version.
      - name: Check Go version pins agree
        run: |
          set -euo pipefail
          mod_version=$(awk '$1 == "go" { print $2 }' go.mod)
          image_version=$(grep -oE 'golang:[0-9]+\.[0-9]+' Dockerfile | head -1 | cut -d: -f2)
          mod_minor=$(echo "$mod_version" | cut -d. -f1,2)
          image_minor=$(echo "$image_version" | cut -d. -f1,2)
          echo "go.mod: $mod_version   Dockerfile: $image_version"
          if [ -z "$image_version" ] || [ "$mod_minor" != "$image_minor" ]; then
            echo "::error::go.mod ($mod_minor) and the Dockerfile toolchain ($image_minor) disagree"
            exit 1
          fi

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          case "$version" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *)   echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "major_minor=${version%.*}" >> "$GITHUB_OUTPUT"
          echo "version is $version"

      # Cross-compiled here rather than in the Dockerfile: the image is
      # multi-arch, but people who run without Docker want a plain binary, and
      # producing both from one Go toolchain keeps them at the same version
      # (the step above is what keeps that claim true).
      # Checked here, before anything is built or pushed, and not at the publish
      # step: a tag whose version was never written in CHANGELOG.md should fail
      # while there is still nothing to undo. Discovering it after the image is on
      # GHCR would leave a published image with no release beside it.
      - name: Read the changelog entry for this release
        run: |
          set -euo pipefail
          sh scripts/changelog-notes.sh "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-notes.md"
          echo "--- release body, from CHANGELOG.md ---"
          cat "$RUNNER_TEMP/release-notes.md"

      - name: Build binaries
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist

          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            goos="${target%/*}"
            goarch="${target#*/}"
            name="crawlping_${VERSION}_${goos}_${goarch}"
            binary="crawlping"
            [ "$goos" = "windows" ] && binary="crawlping.exe"

            workdir="$(mktemp -d)"
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" go build -trimpath \
              -ldflags="-s -w -X main.version=${VERSION}" \
              -o "${workdir}/${name}/${binary}" .

            if [ "$goos" = "windows" ]; then
              (cd "$workdir" && zip -qr "${OLDPWD}/dist/${name}.zip" "${name}")
            else
              (cd "$workdir" && tar -czf "${OLDPWD}/dist/${name}.tar.gz" "${name}")
            fi
            rm -rf "$workdir"
          done

          (cd dist && sha256sum ./* > checksums.txt)
          ls -l dist

      # The assembly check has to run on the release path, not only on a pull
      # request. It lives in the `test` job, and that job cannot run here: it is
      # gated on `github.event_name != 'push'`, and a tag push is the one trigger
      # that publishes. So the guard was absent from exactly the path it guards -
      # and a release shipped with a container that could not read the config it
      # was handed. This script catches that in under a minute.
      #
      # Before anything is pushed on purpose: a tag whose assembly is broken must
      # fail while there is still nothing on GHCR to take back.
      - name: Smoke test the default deployment path
        run: sh scripts/compose-smoke.sh

      # No longer required for the compile: the Dockerfile builds on
      # $BUILDPLATFORM and cross-compiles, so Go never runs under emulation.
      # Kept as insurance for the final stage and for any future non-native
      # step; it costs seconds.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Multi-arch is not optional: building only amd64 and tagging it
      # `latest` is what gives arm64 users `exec format error`.
      - name: Build and push image
        env:
          VERSION: ${{ steps.version.outputs.version }}
          MAJOR_MINOR: ${{ steps.version.outputs.major_minor }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          set -euo pipefail
          tags=(--tag "${IMAGE}:${VERSION}" --tag "${IMAGE}:${MAJOR_MINOR}")
          # A prerelease must never move `latest` for everyone else.
          if [ "$PRERELEASE" = "false" ]; then
            tags+=(--tag "${IMAGE}:latest")
          fi

          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --build-arg "VERSION=${VERSION}" \
            "${tags[@]}" \
            --push .

      # Idempotent on purpose. The image push above can succeed and this step
      # still fail (network, rate limit), and a re-run must not stop at
      # "release already exists" with the artifacts never attached.
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME exists; replacing assets"
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            flags=()
            [ "$PRERELEASE" = "true" ] && flags+=(--prerelease)

            # The body is the CHANGELOG section, read before anything was built.
            # No fallback to --generate-notes: generated notes come from commit
            # subjects, which is precisely where a breaking change does not appear.
            flags+=(--notes-file "$RUNNER_TEMP/release-notes.md")

            gh release create "$GITHUB_REF_NAME" dist/* "${flags[@]}"
          fi
