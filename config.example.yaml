# This address belongs to the container, so it binds every interface inside the
# container. Docker forwards published ports to eth0, never to the container's
# loopback, so 127.0.0.1:8080 here is unreachable from the host even while the
# container reports healthy. "Reachable from this machine only" is the host-side
# `-p 127.0.0.1:8080:8080` in docker-compose.yaml, not this line.
#
# Running the binary directly, with no container? Change it to "127.0.0.1:8080".
# Same for a Cloudflare Tunnel, where cloudflared shares this network namespace.
listen: "0.0.0.0:8080"

# Optional: how much one submission may carry. Both defaults are deliberately far
# below what IndexNow accepts, because a code path that sends hundreds of URLs is
# usually looping. Raise them together for a site migration, which is the
# documented reason to submit a whole site at once: IndexNow's own ceiling is
# 10,000 URLs per request, and a body that carries them needs about 256 bytes per
# URL. The two are one decision - a body too small for the count makes every full
# batch a 413 - so a mismatched pair is refused at startup rather than later. The
# resubmission window's table grows with max_urls_per_request, so one full batch
# is always remembered, and it never shrinks back.
# limits:
#   max_urls_per_request: 100        # 1 to 10000
#   max_body_bytes: 65536            # at least max_urls_per_request * 16, at most 8 MiB

# Optional: which IndexNow endpoint to submit to. The default is the global one,
# and leaving it alone is right for almost everyone: a submission there is
# shared with every participating engine, so there is nothing to fan out
# yourself. Set it only to target a single engine instead. The documented
# endpoints are:
#   https://api.indexnow.org/indexnow       global, the default
#   https://www.bing.com/indexnow
#   https://yandex.com/indexnow
#   https://search.seznam.cz/indexnow
#   https://searchadvisor.naver.com/indexnow
#   https://indexnow.yep.com/indexnow
#   https://indexnow.amazonbot.amazon/indexnow
# indexnow_endpoint: https://api.indexnow.org/indexnow

# One entry per origin you submit for. Generate a token with:
#   openssl rand -hex 32
#
# To add another one later, do not edit this file by hand:
#   crawlping site add -host shop.example.org
#   docker kill -s HUP crawlping
# The command generates the key and token, writes <key>.txt beside this file, and
# keeps the comments you are reading. The service reloads on SIGHUP, so nothing
# restarts and no request is dropped.
#
# The container has to mount this *directory*, not this file: a single-file bind
# mount pins the inode, so an atomic replace (which site add does) is invisible
# until a restart - and a restart is what the reload exists to avoid.
sites:
  - host: example.com
    # A non-ASCII (IDN) host must be punycode: Unicode labels are refused, and a Unicode URL here is foreign.
    # Also the name of the key file served at https://example.com/<key>.txt
    indexnow_key: replace-with-your-indexnow-key
    # Optional: set only when the key file lives somewhere other than the root.
    # key_location: https://example.com/some/path/key.txt
    token: change-me-to-a-hex-string-at-least-16-chars

  # - host: second-site.com
  #   indexnow_key: another-key
  #   token: another-token
